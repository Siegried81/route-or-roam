# CI for route-or-roam: offline tests, React build, Docker image build + smoke test.
#
# grounded-rag (public) is checked out NEXT TO this repo, the same layout the
# README asks for locally, so rr/settings.py finds it without any path setting.
# The Docker job proves the image Render will build actually starts: with
# RR_INGEST_ON_START=1 and the fake embedder it builds both indexes at start-up
# (no key, no network) and must answer /api/health.
name: CI

# Pushes to main and every pull request; a PR branch push runs once, as the PR.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # grounded-rag commit the tests run against: eval/questions.jsonl is labelled
  # against the corpus at this commit (the full AI Act, docs/decisions.md
  # 2026-10-11), and a pin keeps a corpus change upstream from turning this CI
  # red on its own. To bump it: check out the new commit next to this repo, run
  # `python -m eval.locate_gold`, relabel what it reports, then change the sha.
  # The Dockerfile's default ARG is the same commit (tests/test_deploy_config.py
  # checks it), so the docker job and Render build what the tests ran against.
  GROUNDED_RAG_REF: 68b8b9393ca710f79bb9eaca04d91d31e6ac6cdc

# A new push to the same branch cancels the run still going for the old commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          path: route-or-roam
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          repository: Siegried81/grounded-rag
          path: grounded-rag
          ref: ${{ env.GROUNDED_RAG_REF }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            route-or-roam/requirements.lock
            route-or-roam/requirements-dev.txt
      # The locked versions the image ships, plus the test-only tools.
      - run: pip install -r route-or-roam/requirements.lock -r route-or-roam/requirements-dev.txt
      - run: python -m pytest -q
        working-directory: route-or-roam

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7
        with:
          node-version: 26  # the Dockerfile's node:26-alpine, so CI builds the UI the image ships
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - run: docker build -t route-or-roam:ci .
      - name: Smoke test (indexes built with the fake embedder, no key needed)
        run: |
          docker run -d --name rr -p 8001:8001 \
            -e RR_INGEST_ON_START=1 -e EMBED_PROVIDER=fake route-or-roam:ci
          for i in $(seq 1 45); do
            curl -sf http://localhost:8001/api/health && break
            sleep 2
          done
          docker logs rr
          curl -sf http://localhost:8001/api/health
