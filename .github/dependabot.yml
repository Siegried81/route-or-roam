# Dependency version updates, monthly. Each ecosystem gets two grouped PRs at
# most: one for minor and patch releases, one for major releases, so a breaking
# major is never hidden among routine bumps and the list of suspects stays short.
# Two exceptions get a single PR. GitHub Actions, because their majors rarely
# touch application code. pip, because its floors (`>=`) leave Dependabot unable
# to tell a major from a patch (see the note on that entry).
# While a group PR is open, Dependabot rebases it with newer releases instead
# of opening another one. Security updates arrive as soon as an advisory is
# published, whatever the schedule.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    # One group with no update-types filter. requirements.txt pins floors
    # (`>=`), so Dependabot has no current version to compare against (its
    # log says "Updating pydantic from  to 2.14.2") and cannot tell a major
    # from a patch. A group filtered on update-types then matches nothing,
    # reports "Nothing to update", and every bump falls back to a PR of its
    # own. Without the filter, all of them land in this one PR.
    groups:
      python-deps:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: monthly
    groups:
      web-deps:
        patterns: ["*"]
        update-types: [minor, patch]
      web-majors:
        patterns: ["*"]
        update-types: [major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    groups:
      docker-images:
        patterns: ["*"]
        update-types: [minor, patch]
      docker-majors:
        patterns: ["*"]
        update-types: [major]
    # The runtime stage stays on python:3.12-slim: 3.15-slim has no zstandard
    # wheel, so the image build fails. Dependabot reads 3.12 -> 3.15 as a minor
    # bump and would put it back in the routine group. Remove this once
    # zstandard publishes a wheel for the newer Python.
    ignore:
      - dependency-name: python
        versions: [">=3.13"]
